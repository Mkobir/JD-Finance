<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JD Finance</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#385c4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JD Finance">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#20221f;--muted:#7b7d78;--green:#385c4b;--line:#e8e5de;--red:#b84c4c;--gold:#b07a27}
*{box-sizing:border-box}html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%;width:100%;overflow-x:hidden}body{margin:0;width:100%;min-width:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh;width:100%}
.side{width:240px;flex:0 0 240px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;z-index:60}.brand{font-size:25px;font-weight:800;padding:0 12px 25px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:3px}.nav button{width:100%;background:transparent;text-align:left;padding:12px;border-radius:12px;color:#555;margin:2px 0}.nav button.active,.nav button:hover{background:#edf2ee;color:var(--green);font-weight:700}.drawer-close{display:none}
.main{flex:1;min-width:0;width:calc(100% - 240px);max-width:1450px;padding:30px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:25px}.top-left{display:flex;align-items:center;gap:10px;min-width:0}.top h1{margin:0;font-size:30px;line-height:1.15}.menu-btn{display:none}.picker{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}.hero{background:var(--green);color:#fff;border-radius:24px;padding:25px}.hero .big{font-size:38px;font-weight:800;margin:5px 0 16px}.muted{color:var(--muted)}.hero .muted{color:#dbe5df}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat .num{font-size:22px;font-weight:800;margin-top:6px}.green{color:#26734d}.red{color:var(--red)}.gold{color:var(--gold)}.section{margin-top:22px}.section h2{font-size:19px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.table-wrap{width:100%;overflow-x:auto}.pill{padding:5px 9px;border-radius:99px;background:#f0f1ed;font-size:11px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.input{padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:11px}.primary{background:var(--green);color:#fff;padding:11px 15px;border-radius:11px}.secondary{background:#fff;border:1px solid var(--line);padding:11px 15px;border-radius:11px}.danger{color:var(--red)}.empty{text-align:center;padding:45px;color:var(--muted)}.low{background:#fff6df}.modal{position:fixed;inset:0;background:rgba(20,25,21,.25);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.show{display:flex}.modalbox{width:min(540px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 20px 70px #0002}.form{display:grid;gap:11px}.form label{font-size:12px;color:var(--muted)}.form input,.form select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mobilebar,.mobile-overlay{display:none}
@media (max-width:900px){
 body{font-size:14px}.side{position:fixed;left:0;top:0;bottom:0;height:100dvh;width:min(290px,84vw);transform:translateX(-105%);transition:transform .22s ease;box-shadow:12px 0 35px rgba(0,0,0,.14);z-index:60}.side.open{transform:translateX(0)}.drawer-close{display:flex;position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;align-items:center;justify-content:center;background:#f2f3ef;color:#555;font-size:24px}.mobile-overlay.show{display:block;position:fixed;inset:0;background:rgba(20,25,21,.35);z-index:50}.main{width:100%;max-width:none;padding:16px 14px 94px}.menu-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:20px;color:var(--green)}.top{margin-bottom:18px}.top h1{font-size:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;width:100%;height:70px;background:rgba(255,255,255,.98);border-top:1px solid var(--line);z-index:55;justify-content:space-around;padding:6px 5px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px rgba(0,0,0,.07)}.mobilebar button{background:none;color:#73766f;min-width:56px;flex:1;max-width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:11px;padding:4px 5px}.mobilebar button.active{color:var(--green);font-weight:800;background:#edf2ee}.mobilebar small{font-size:10px;line-height:1}.micon{font-size:19px;line-height:1}
}
@media (max-width:600px){
 html{font-size:16px}.main{padding:12px 12px 96px}.top{flex-wrap:wrap;align-items:center;gap:8px}.top-left{flex:1 1 55%;min-width:0}.top-left>div:last-child{min-width:0}.top h1{font-size:22px;white-space:nowrap}.top .muted{display:block;font-size:11px;white-space:nowrap}.picker{flex:1 1 40%;min-width:135px;padding:9px 10px;font-size:13px}.hero{padding:18px;border-radius:18px}.hero .big{font-size:31px}.stats{gap:8px}.stats .muted{font-size:10px}.stats b{font-size:13px}.grid{gap:9px}.card{padding:14px;border-radius:15px}.section{margin-top:16px}.section h2{font-size:17px}.toolbar{gap:8px}.toolbar .input{flex:1 1 100%;min-width:0}.primary,.secondary{padding:10px 12px}.row{grid-template-columns:1fr}.modal{padding:12px}.modalbox{padding:18px;border-radius:18px;max-height:88dvh}.table{min-width:620px}
}
@media (max-width:380px){.main{padding-left:10px;padding-right:10px}.top h1{font-size:20px}.grid{grid-template-columns:1fr 1fr}.card{padding:12px}.mobilebar button{min-width:48px}.mobilebar small{font-size:9px}}
</style>
</head>
<body>
<div class="app"><div class="mobile-overlay" id="mobileOverlay" onclick="closeDrawer()"></div>
<aside class="side" id="side"><button class="drawer-close" onclick="closeDrawer()">×</button><div class="brand">JD Finance<small>JD Kitchen • JD Atelier</small></div><div id="nav" class="nav"></div></aside>
<main class="main"><div class="top"><div class="top-left"><button class="menu-btn" onclick="openDrawer()">☰</button><div><h1 id="title">Dashboard</h1><span class="muted">Your business, clearly.</span></div></div><select id="business" class="picker" onchange="render()"><option>JD Kitchen</option><option>JD Atelier</option><option>All Businesses</option></select></div><div id="content"></div></main>
</div>
<div class="mobilebar" id="mobilebar"></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY="jd_finance_v1";
const APP_VERSION="3.0-mobile";
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 transactions:[],products:[],parties:[],budgets:[],
 settings:{currency:"BDT"}
};
let page="Dashboard";
const nav=["Dashboard","Transactions","Products","Inventory","Customers","Suppliers","Reports","Budgets","Settings"];
const money=n=>"৳"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
function openDrawer(){document.getElementById("side").classList.add("open");document.getElementById("mobileOverlay").classList.add("show")}function closeDrawer(){document.getElementById("side").classList.remove("open");document.getElementById("mobileOverlay").classList.remove("show")}function seed(){if(db.transactions.length)return;
db.transactions=[
{id:uid(),date:today(),business:"JD Kitchen",type:"income",title:"Order #104",category:"Sales",account:"bKash",amount:4800},
{id:uid(),date:today(),business:"JD Kitchen",type:"expense",title:"Ingredients",category:"Ingredients",account:"Cash",amount:2480},
{id:uid(),date:today(),business:"JD Kitchen",type:"expense",title:"Packaging",category:"Packaging",account:"Cash",amount:900},
{id:uid(),date:today(),business:"JD Atelier",type:"expense",title:"Fabric House",category:"Materials",account:"Bank",amount:6200}
];save()}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()}
function today(){return new Date().toISOString().slice(0,10)}
function vis(){let b=document.getElementById("business").value;return b==="All Businesses"?db.transactions:db.transactions.filter(x=>x.business===b)}
function renderNav(){document.getElementById("nav").innerHTML=nav.map(x=>`<button class="${page===x?"active":""}" onclick="go('${x}');closeDrawer()">${icon(x)} <span>${x}</span></button>`).join("");const mobile=["Dashboard","Transactions","Products","Reports","Settings"];document.getElementById("mobilebar").innerHTML=mobile.map(x=>`<button class="${page===x?"active":""}" onclick="go('${x}')"><span class="micon">${icon(x)}</span><small>${x}</small></button>`).join("")}
function icon(x){return({Dashboard:"⌂",Transactions:"☷",Products:"▦",Inventory:"◫",Customers:"♙",Suppliers:"♧",Reports:"◒",Budgets:"▤",Settings:"⚙"})[x]||"•"}
function go(x){page=x;document.getElementById("title").textContent=x;renderNav();render()}
function render(){let c=document.getElementById("content");({Dashboard:dashboard,Transactions:transactions,Products:products,Inventory:inventory,Customers:()=>parties("Customer"),Suppliers:()=>parties("Supplier"),Reports:reports,Budgets:budgets,Settings:settings}[page])()}
function dashboard(){let t=vis(),inc=sum(t.filter(x=>x.type==="income")),exp=sum(t.filter(x=>x.type==="expense")),profit=inc-exp,low=db.products.filter(p=>p.stock<=p.low);
document.getElementById("content").innerHTML=`<div class="hero"><div class="muted">NET PROFIT</div><div class="big">${money(profit)}</div><div class="stats"><div><div class="muted">Revenue</div><b>${money(inc)}</b></div><div><div class="muted">Expenses</div><b>${money(exp)}</b></div><div><div class="muted">Margin</div><b>${inc?Math.round(profit/inc*100):0}%</b></div></div></div>
<div class="grid section"><div class="card"><span class="muted">Revenue</span><div class="stat num green">${money(inc)}</div></div><div class="card"><span class="muted">Expenses</span><div class="stat num red">${money(exp)}</div></div><div class="card"><span class="muted">Transactions</span><div class="stat num">${t.length}</div></div><div class="card"><span class="muted">Low stock</span><div class="stat num gold">${low.length}</div></div></div>
<div class="section"><h2>Recent transactions</h2>${txTable(t.slice().reverse().slice(0,7))}</div>`}
function txTable(t){if(!t.length)return `<div class="card empty">No transactions yet.</div>`;return `<div class="card"><table class="table"><tr><th>Date</th><th>Description</th><th>Category</th><th>Account</th><th>Amount</th><th></th></tr>${t.map(x=>`<tr><td>${x.date}</td><td><b>${esc(x.title)}</b><br><small class="muted">${x.business}</small></td><td><span class="pill">${esc(x.category)}</span></td><td>${esc(x.account||"")}</td><td class="${x.type==="income"?"green":"red"}"><b>${x.type==="income"?"+":"-"}${money(x.amount)}</b></td><td><button class="secondary danger" onclick="delTx('${x.id}')">Delete</button></td></tr>`).join("")}</table></div>`}
function transactions(){let t=vis();document.getElementById("content").innerHTML=`<div class="toolbar"><input class="input" id="q" placeholder="Search transactions..." oninput="filterTx()"><select class="input" id="tf" onchange="filterTx()"><option>All</option><option>income</option><option>expense</option><option>transfer</option></select><button class="primary" onclick="addTx()">+ Add transaction</button></div><div id="txlist">${txTable(t.slice().reverse())}</div>`}
function filterTx(){let q=document.getElementById("q").value.toLowerCase(),f=document.getElementById("tf").value,t=vis().filter(x=>(f==="All"||x.type===f)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.getElementById("txlist").innerHTML=txTable(t.slice().reverse())}
function addTx(){modal(`<h2>Add transaction</h2><form class="form" onsubmit="submitTx(event)"><div class="row"><div><label>Business</label><select id="fBiz"><option>JD Kitchen</option><option>JD Atelier</option></select></div><div><label>Type</label><select id="fType"><option value="expense">Expense</option><option value="income">Income</option><option value="transfer">Transfer</option></select></div></div><label>Description</label><input id="fTitle" required placeholder="e.g. Ingredients"><div class="row"><div><label>Amount</label><input id="fAmount" type="number" step="0.01" required></div><div><label>Date</label><input id="fDate" type="date" value="${today()}"></div></div><div class="row"><div><label>Category</label><input id="fCat" value="Other"></div><div><label>Account</label><select id="fAcc">${["Cash","Bank","bKash","Nagad","Card"].map(x=>`<option>${x}</option>`).join("")}</select></div></div><label>Note</label><input id="fNote" placeholder="Optional"><div><button class="primary">Save</button> <button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`)}
function submitTx(e){e.preventDefault();db.transactions.push({id:uid(),business:fBiz.value,type:fType.value,title:fTitle.value,amount:+fAmount.value,date:fDate.value,category:fCat.value,account:fAcc.value,note:fNote.value});save();closeModal();render()}
function delTx(id){db.transactions=db.transactions.filter(x=>x.id!==id);save();render()}
function products(){document.getElementById("content").innerHTML=`<div class="toolbar"><button class="primary" onclick="addProduct()">+ Add product</button></div><div class="card"><table class="table"><tr><th>Product</th><th>Business</th><th>Cost</th><th>Price</th><th>Margin</th><th>Stock</th></tr>${db.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.business}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td class="green">${money(p.price-p.cost)} (${p.price?Math.round((p.price-p.cost)/p.price*100):0}%)</td><td>${p.stock} ${p.unit}</td></tr>`).join("")}</table>${!db.products.length?'<div class="empty">No products yet. Add your products and their real unit costs.</div>':''}</div>`}
function addProduct(){modal(`<h2>Add product</h2><form class="form" onsubmit="submitProduct(event)"><label>Business</label><select id="pBiz"><option>JD Kitchen</option><option>JD Atelier</option></select><label>Product name</label><input id="pName" required><div class="row"><div><label>Selling price</label><input id="pPrice" type="number" step=".01" required></div><div><label>Unit cost</label><input id="pCost" type="number" step=".01" required></div></div><div class="row"><div><label>Opening stock</label><input id="pStock" type="number" step=".01" value="0"></div><div><label>Low-stock level</label><input id="pLow" type="number" step=".01" value="5"></div></div><label>Unit</label><input id="pUnit" value="pcs"><button class="primary">Save product</button></form>`)}
function submitProduct(e){e.preventDefault();db.products.push({id:uid(),business:pBiz.value,name:pName.value,price:+pPrice.value,cost:+pCost.value,stock:+pStock.value,low:+pLow.value,unit:pUnit.value});save();closeModal();render()}
function inventory(){let ps=db.products;document.getElementById("content").innerHTML=`<div class="grid">${ps.map(p=>`<div class="card ${p.stock<=p.low?"low":""}"><b>${esc(p.name)}</b><div class="muted">${p.business}</div><div style="font-size:25px;font-weight:800;margin-top:10px">${p.stock} ${p.unit}</div><small>${p.stock<=p.low?"⚠ Low stock":"Stock healthy"} • Cost ${money(p.cost)}</small></div>`).join("")}</div>${!ps.length?'<div class="card empty">Add products first to manage inventory.</div>':''}`}
function parties(kind){let ps=db.parties.filter(p=>p.kind===kind);document.getElementById("content").innerHTML=`<div class="toolbar"><button class="primary" onclick="addParty('${kind}')">+ Add ${kind.toLowerCase()}</button></div><div class="card"><table class="table"><tr><th>Name</th><th>Business</th><th>Outstanding</th></tr>${ps.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.business}</td><td class="${p.due>0?"red":"green"}"><b>${money(p.due)}</b></td></tr>`).join("")}</table>${!ps.length?'<div class="empty">No records yet.</div>':''}</div>`}
function addParty(kind){modal(`<h2>Add ${kind}</h2><form class="form" onsubmit="submitParty(event,'${kind}')"><label>Business</label><select id="cBiz"><option>JD Kitchen</option><option>JD Atelier</option></select><label>Name</label><input id="cName" required><label>Outstanding amount</label><input id="cDue" type="number" step=".01" value="0"><button class="primary">Save</button></form>`)}
function submitParty(e,kind){e.preventDefault();db.parties.push({id:uid(),business:cBiz.value,name:cName.value,kind,due:+cDue.value});save();closeModal();render()}
function reports(){let t=vis(),inc=sum(t.filter(x=>x.type==="income")),exp=sum(t.filter(x=>x.type==="expense")),groups={};t.filter(x=>x.type==="expense").forEach(x=>groups[x.category]=(groups[x.category]||0)+x.amount);document.getElementById("content").innerHTML=`<div class="grid"><div class="card"><span class="muted">Revenue</span><h2 class="green">${money(inc)}</h2></div><div class="card"><span class="muted">Expenses</span><h2 class="red">${money(exp)}</h2></div><div class="card"><span class="muted">Profit</span><h2>${money(inc-exp)}</h2></div><div class="card"><span class="muted">Margin</span><h2>${inc?Math.round((inc-exp)/inc*100):0}%</h2></div></div><div class="section card"><h2>Expense breakdown</h2>${Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(x=>`<p><b>${esc(x[0])}</b><span style="float:right">${money(x[1])}</span></p>`).join("")||'<div class="empty">No expenses.</div>'}</div><div class="section"><button class="secondary" onclick="downloadCSV()">Export transactions CSV</button></div>`}
function budgets(){document.getElementById("content").innerHTML=`<div class="toolbar"><button class="primary" onclick="addBudget()">+ Add budget</button></div><div class="grid">${db.budgets.map(b=>{let pct=b.limit?Math.min(100,b.spent/b.limit*100):0;return `<div class="card"><b>${esc(b.category)}</b><div class="muted">${b.business}</div><h2>${money(b.spent)} / ${money(b.limit)}</h2><div style="height:8px;background:#eee;border-radius:9px"><div style="height:8px;width:${pct}%;background:${pct>100?"#b84c4c":"#385c4b"};border-radius:9px"></div></div></div>`}).join("")}</div>${!db.budgets.length?'<div class="card empty">No budgets yet.</div>':''}`}
function addBudget(){modal(`<h2>Add budget</h2><form class="form" onsubmit="submitBudget(event)"><label>Business</label><select id="bBiz"><option>JD Kitchen</option><option>JD Atelier</option></select><label>Category</label><input id="bCat" value="Ingredients"><label>Monthly limit</label><input id="bLimit" type="number" step=".01"><button class="primary">Save</button></form>`)}
function submitBudget(e){e.preventDefault();db.budgets.push({business:bBiz.value,category:bCat.value,limit:+bLimit.value,spent:0});save();closeModal();render()}
function settings(){document.getElementById("content").innerHTML=`<div class="card"><h2>Data & backup</h2><p class="muted">Your data is currently stored locally in this browser.</p><div class="toolbar"><button class="primary" onclick="backup()">Download backup</button><button class="secondary" onclick="restore()">Restore backup</button><button class="secondary" onclick="downloadCSV()">Export CSV</button></div></div><div class="card section"><h2>Google Sheets</h2><p>For now, export CSV and import it into Google Sheets. A future version can connect directly to Google Drive/Sheets.</p></div><div class="card section"><h2>Android</h2><p class="muted">This web app is ready to be packaged as an Android app with Capacitor or a Trusted Web Activity. See the included README.</p></div>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});downloadBlob(blob,"JD-Finance-Backup.json")}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render()}catch(e){alert("Invalid backup file")}};r.readAsText(i.files[0])};i.click()}
function downloadCSV(){let rows=[["Date","Business","Type","Description","Category","Account","Amount"],...db.transactions.map(x=>[x.date,x.business,x.type,x.title,x.category,x.account,x.amount])];downloadBlob(new Blob([rows.map(r=>r.map(csv).join(",")).join("\n")],{type:"text/csv"}),"JD-Finance-Transactions.csv")}
function csv(x){return`"${String(x??"").replaceAll('"','""')}"`}
function downloadBlob(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function modal(html){document.getElementById("modalbox").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function sum(a){return a.reduce((s,x)=>s+x.amount,0)}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
seed();renderNav();render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
</script>
</body></html>
